  description_updated_at: '2026-10-19T06:31:59Z'
- id: eval_metrics_v3
  version: '1'
  adapter: yaml_pipeline
  name: 评测指标 v3
  definition: pipelines/eval_metrics_v3.yaml
  status: enabled
  purpose: evaluation
  input_kinds:
  - dataset
