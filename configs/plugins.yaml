  supports_tag_selection: false
  parameters_schema:
    type: object
    additionalProperties: false
    properties:
      filters:
        type: object
        description: 冻结的样本筛选条件（与列表查询同口径）
      frozen_dataset_id:
        type: string
        description: 导出时冻结的数据集版本路径
      source_dataset_id:
        type: string
        description: 原始已发布数据集 ID
      use_work_copy:
        type: boolean
        description: 是否优先使用 annotation_work 工作副本
      revision:
        type: string
