- id: dnsmos_score_batch
  version: '1'
  adapter: yaml_pipeline
  name: DNSMOS 质量评分
  definition: pipelines/dnsmos_score_batch.yaml
  status: enabled
  purpose: processing
  input_kinds:
  - dataset
  supports_tag_selection: false
  parameters_schema:
    type: object
    additionalProperties: false
    properties: {}
  description: 对片段清单计算 DNSMOS 音质分数，写出带质量评分的结果清单。
  description_updated_at: '2026-10-19T06:31:59Z'
- id: evidence_join
  version: '1'
  adapter: yaml_pipeline
  name: 证据合并
  definition: pipelines/evidence_join.yaml
  status: enabled
  purpose: processing
  input_kinds:
  - dataset
  supports_tag_selection: false
  parameters_schema:
    type: object
    additionalProperties: false
    properties: {}
  description: 把片段、多路识别结果和 DNSMOS 评分对齐合并成一份证据清单，供后续打标使用。
  description_updated_at: '2026-10-19T06:31:59Z'
- id: tag_dataset_free_tags_v2
  version: '1'
  adapter: yaml_pipeline
  name: 自由标签 v2 打标流水线
  description: 对已准备好的证据清单按所选规则打标签，生成带标签的数据清单和汇总表。也可在打标任务里直接选标签运行。
  definition: pipelines/tag_dataset_free_tags_v2.yaml
  status: enabled
  purpose: tagging
  input_kinds:
  - dataset
  supports_tag_selection: true
  parameters_schema:
    type: object
    additionalProperties: false
    properties:
      evidence_mode:
        type: string
        title: 证据模式
        enum:
        - existing
        - compute_acoustic
        default: existing
  description_updated_at: '2026-10-19T06:31:59Z'
