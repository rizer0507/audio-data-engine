api_version: '1'
extension_modules: []
pipelines:
- id: audio_ingest_vad_asr_dnsmos_tags
  version: '1'
  adapter: production_pipeline
  name: 入库、切段、多路识别、质量评分与标签
  description: 把已登记的原始录音入库并切成片段，用多路模型识别说话内容并做音质评分，再按规则打标签，最后生成可查看和导出的数据清单、报告与标注包。
  definition: pipelines/audio_ingest_vad_asr_dnsmos_tags.yaml
  status: enabled
  purpose: processing
  input_kinds:
  - source
  supports_tag_selection: true
  output_kinds:
  - manifest
  - report
  - annotation_package
  description_updated_at: '2026-10-19T06:31:59Z'
- id: audio_ingest
  version: '1'
  adapter: yaml_pipeline
  name: 音频入库
  definition: pipelines/audio_ingest.yaml
  status: enabled
  purpose: processing
  input_kinds:
  - source
  supports_tag_selection: false
  parameters_schema:
    type: object
    additionalProperties: false
    title: 入库参数
    properties: {}
  description: 扫描已登记的音频数据源，把音频统一转成 16k 单声道 WAV，生成入库后的数据清单。
  description_updated_at: '2026-10-19T06:31:59Z'
- id: vad_segment_batch
  version: '1'
  adapter: yaml_pipeline
  name: FSMN-VAD 切段
  definition: pipelines/vad_segment_batch.yaml
  status: enabled
  purpose: processing
  input_kinds:
  - source
  - dataset
  supports_tag_selection: false
  parameters_schema:
    type: object
    additionalProperties: false
    properties: {}
  description: 对已入库的音频按语音活动检测切成片段，生成片段清单和切段结果。
  description_updated_at: '2026-10-19T06:31:59Z'
- id: qwen_asr_batch
  version: '1'
  adapter: yaml_pipeline
  name: Qwen ASR 批处理
  description: 对已有 16k 重采样资产的数据清单，用 Qwen 做批量语音识别并规范化结果，写出识别清单。不直接接受原始目录。
  definition: pipelines/qwen_asr_batch.yaml
  status: enabled
  purpose: processing
  input_kinds:
  - dataset
  supports_tag_selection: false
  parameters_schema:
    type: object
    additionalProperties: false
    title: Qwen ASR 参数
    properties:
      language:
        type: string
        title: 语言
        description: 传给 Qwen chat ASR 的语言提示（若算子支持）
        default: zh
  description_updated_at: '2026-10-19T06:31:59Z'
- id: glm_asr_batch
