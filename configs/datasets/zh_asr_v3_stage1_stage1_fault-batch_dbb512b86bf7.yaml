  pseudo_high_audited: 0.2
train_cross_constraints:
  min_positive_ratio: 0.15
  min_negative_ratio: 0.15
  min_noisy_crosstalk_ratio: 0.1
  max_non_speech_ratio: 0.1
  max_pseudo_high_ratio: 0.2
