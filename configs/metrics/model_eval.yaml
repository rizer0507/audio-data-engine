# 工序⑤：相对金标（gold_text）计算各模型 CER / 字准率。
# hypotheses 缺省 = 样本上除 gold 外的全部 transcript keys（由 quality.text_metrics 展开）。
# CLI：audio-data pipeline run pipelines/eval_metric_pipeline.yaml \
#        --eval-name eval_local_test --eval-model qwen --eval-model qwen-sft-epoch10
#
# 分组维度：evaluation_report 默认按 type；若存在 subtype 则导出 type/subtype。
# 空标桶（true_silence / invalid_audio / noise）从主 CER 剔除，单独记入 empty_ref_slice。
#
# 业务风险指标（NFR/FAR/NAHR/FAER/NSHR/肯定保留率/…）不在此文件重复实现；
# 统一由 configs/metrics/business_risk_v1.yaml + MetricRunner / evaluation_report 消费（012-E）。

vs_gold:
  reference_field: gold_text
  purpose: model_evaluation
  metrics: [cer]
  # hypotheses: [qwen, qwen-sft-epoch10, qwen-sft-epoch100]  # 可选；省略则自动发现

# 可选报告扩展点（由 evaluation_report / 业务指标消费）
group_by:
  - type
  - subtype
  - semantic_class
  - human_semantic
  - gold_kind
