model: kimi-audio-7b-instruct
model_path: /data2/data-cp/models/kimi-audio
model_version: "Kimi-Audio-7B-Instruct"
device: cuda

# ASR 仅需文本输出；关闭 detokenizer 可显著节省显存。
load_detokenizer: false

# Official KimiAudio.generate is one utterance at a time. Keep this at 1.
# Dual A800 throughput comes from two shard processes (see
# pipelines/kimi_audio_asr_batch.yaml), not from in-process batching.
batch_size: 1
inference_threads: 1

prompt: Please transcribe the audio accurately. Output only the transcription.
model_kwargs: {}
generation_kwargs:
  audio_temperature: 0.0
  audio_top_k: 5
  text_temperature: 0.0
  text_top_k: 5
