# Canonical Kimi-Audio backend: weights are loaded directly in every shard process.
model: kimi-audio-7b-instruct
model_path: /data2/data-cp/models/kimi-audio
model_version: "Kimi-Audio-7B-Instruct"
device: cuda
load_detokenizer: false

# Native batch size. Increase until GPU memory is saturated; failed batches are
# retried per file so one corrupt recording does not poison the entire shard.
batch_size: 8
# Only used when the installed kimia_infer has no native batch API. Keep at 1
# unless the backend explicitly documents concurrent generate() as thread-safe.
inference_threads: 1

prompt: Please transcribe the audio accurately. Output only the transcription.
model_kwargs: {}
generation_kwargs:
  audio_temperature: 0.0
  audio_top_k: 5
  text_temperature: 0.0
  text_top_k: 5
