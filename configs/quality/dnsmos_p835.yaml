# DNSMOS P.835（算法配置；045 正式入口见 pipelines/dnsmos_score_batch.yaml）
# 新生产产物：datasets/stage1/quality/dnsmos_<batch>.parquet（非 quality_sidecar_*）
# 历史 audio_quality_sidecar 仅研究/复现；旧五类按需候选入口仍可读本文件。
# 模型文件需自行放置到 model_path；服务器部署必须改成服务器可读的绝对路径。
# calibrated: false → 可输出分数，但 noise_band/noise_risk 为 unknown/null。禁止改 true。

quality_policy_version: quality_policy_v3.0
input_audio_key: resampled_16k
model_path: /data2/data-cp/lizi/DNS-Challenge-master/DNSMOS/DNSMOS/sig_bak_ovr.onnx
preprocess_version: p835_official_nonpersonalized_v2
providers:
  - CPUExecutionProvider

# 评分并发由流水线 worker 提供；每个独立 ONNX 会话不再各开全机线程池。
runtime:
  intra_op_num_threads: 2
  inter_op_num_threads: 1
  allow_spinning: false
  # 同一片段的窗口合批；逐窗校准后求平均，窗口范围与评分公式不变。
  window_batch_size: 4

# 阈值须在独立人工校准池上验证；未校准不得改生产默认 calibrated=true。
calibrated: false

thresholds:
  # noise_risk = (BAK < moderate_bak) OR (OVRL < moderate_ovrl)
  clean_bak: 3.5
  clean_ovrl: 3.2
  moderate_bak: 3.0
  moderate_ovrl: 2.8
  t_bak: 3.0
  t_ovrl: 2.8

# 固定 WAV 验收容差（有真实模型与参考分时启用）
acceptance:
  score_atol: 0.15
  require_model: true
