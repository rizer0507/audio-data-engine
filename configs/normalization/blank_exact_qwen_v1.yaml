# qwen 族热词清空（CER 之前 / ASR 落盘 normalize，与 zh_asr_v1 去标点同一阶段）。
# embedded: 下面这一整句只要原样出现就删掉，前后还可以有别的字。
# 例: 嗯没有，暂时不用，不需要谢谢，不可以啊，不用，我不需要，不要，不用，不需要 → 嗯
# 整句只有这一段时 text 为空。不会拆成「不需要」去匹配。
# models：显式列出常用键；引擎另按族 stem 匹配未来 --asr-run 别名（如 qwen3 / qwen-sft-*）。
blank_exact_hotwords:
  models: [qwen, qwen1, qwen2]
  embedded: true
  hotwords:
    - 没有暂时不用不需要谢谢不可以啊不用我不需要不要不用不需要
