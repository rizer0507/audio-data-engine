# selection_v3.0 / consensus_v3 — 多家族双跑分拣（012-B / 015：N≥3）
# 四族八路为推荐示例；三族见 zh_asr_v3_three_family.yaml。不得覆盖旧分拣产物。
# 校准未通过前禁止自动发布伪标签训练集。
policy_version: selection_zh_asr_v3_0
engine: consensus_v3
rule_version: selection_v3.0
target_family: qwen

model_families:
  kimi:
    - kimi_1
    - kimi_2
  glm:
    - glm_1
    - glm_2
  sensevoice:
    - sensevoice_1
    - sensevoice_2
  qwen:
    - qwen_1
    - qwen_2

teacher_families:
  - kimi
  - glm
  - sensevoice

expected_runs_per_family: 2

similarity:
  family_threshold: 0.98
  teacher_consensus_threshold: 0.98
  pseudo_high_min_similarity: 0.98
  pseudo_medium_min_similarity: 0.95
  pseudo_medium_min_stable_families: 3

short_utterance:
  max_audio_sec: 2.0
  max_text_chars: 6

# 018：相对时长的字率不可能（ASR 之后分拣栏；不在①音频清洗）
# disposition: exclude | manual_review | route_quarantine
# 默认 exclude（018 兼容）；020 影子/重构用 route_quarantine
speech_rate:
  max_chars_per_sec: 25
  min_text_chars: 80
  disposition: exclude

# 质量：023 新默认不在此文件。本文件是旧全量门禁回退。
# noise_policy=legacy_full_quality_gate 仍要求先跑 audio_quality_sidecar。
# 新入口是 pipelines/classify_dataset_v3_asr_anomaly_noise.yaml（noise_policy 由流水线覆盖）。
quality:
  calibrated: false
  noise_policy: legacy_full_quality_gate

# refactor_020_mode: off

semantic_lexicon_path: configs/selection/semantic_lexicon_zh_v3.yaml
voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml

defaults:
  label_broken: false
