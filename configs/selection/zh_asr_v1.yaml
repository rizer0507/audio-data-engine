# 工序③分拣策略：transcript consensus selection_v1.1
# 无「字准率」；使用模型族感知的 transcript_similarity + medoid，禁止随机选金标。
policy_version: selection_zh_asr_v1_6
engine: consensus_v1
rule_version: selection_v1.1

strict_threshold: 0.95
consensus_threshold: 0.90
dominant_ratio: 0.75
empty_ratio_for_hallucination: 0.75

primary_family: qwen
secondary_family: sensevoice

model_families:
  qwen:
    - qwen
    - qwen1
    - qwen2
  sensevoice:
    - sensevoice
    - sensevoice1
    - sensevoice2
  doubao:
    - doubao
    - doubao1
    - doubao2
  kimi:
    - kimi
    - kimi1
    - kimi2

semantic:
  # negative 优先于 positive，避免「不需要」命中「需要」
  negative:
    - 暂时不需要
    - 不考虑
    - 没需要
    - 不需要
    - 不愿意
    - 不可以
    - 不用
    - 不要
  positive:
    - 有需要
    - 可以
    - 愿意
    - 考虑
    - 需要
    - 要

voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml

defaults:
  label_broken: false
