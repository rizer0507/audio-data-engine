# selection_v3.0 — 0908-30000 存量三族方案 B（014 §5.2）
# 保留现网别名 qwen3-asr-* / glm-asr-* / sensevoice-asr-*，显式归族；禁止靠文件名猜测。
# 不要求第四族 Kimi（015）。新批次请优先用契约别名 qwen_1…（方案 A）。
policy_version: selection_zh_asr_v3_0
engine: consensus_v3
rule_version: selection_v3.0
target_family: qwen

model_families:
  glm:
    - glm-asr-1
    - glm-asr-2
  sensevoice:
    - sensevoice-asr-1
    - sensevoice-asr-2
  qwen:
    - qwen3-asr-1
    - qwen3-asr-2

teacher_families:
  - glm
  - sensevoice

expected_runs_per_family: 2

# 显式别名→族（与 model_families 一致；防止仅靠 stem 猜测）
run_aliases:
  glm-asr-1: glm
  glm-asr-2: glm
  sensevoice-asr-1: sensevoice
  sensevoice-asr-2: sensevoice
  qwen3-asr-1: qwen
  qwen3-asr-2: qwen

similarity:
  family_threshold: 0.98
  teacher_consensus_threshold: 0.98
  pseudo_high_min_similarity: 0.98
  pseudo_medium_min_similarity: 0.95
  pseudo_medium_min_stable_families: 3

short_utterance:
  max_audio_sec: 2.0
  max_text_chars: 6

quality:
  calibrated: false

semantic_lexicon_path: configs/selection/semantic_lexicon_zh_v3.yaml
voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml

defaults:
  label_broken: false
