# 业务语义 / 关键 token 词表（selection_v3.0）
# 禁止把词表硬编码进 Python；比较前禁止删除这些业务关键 token。
# 否定最长短语优先；禁止简单 contains「需要」就判 positive。

negative:
  - 不贷款
  - 不考虑
  - 不想
  - 不办
  - 不缺
  - 暂时不需要
  - 没需要
  - 不需要
  - 不愿意
  - 不可以
  - 不行
  - 不是
  - 没有
  - 没用
  - 没要
  - 不用
  - 不要
  - 没
  - 不

positive:
  - 有需要
  - 有需求
  - 想要
  - 想办
  - 要用
  - 好的
  - 需要
  - 可以
  - 考虑
  - 缺
  - 要
  - 是
  - 有
  - 好

# 语气词（与肯定词冲突 → filler_affirmation）
filler:
  - 嗯嗯
  - 嗯
  - 啊
  - 哦
  - 呃
  - 额
  - 唔

# 肯定短反馈（与 filler 对照）
affirmation:
  - 需要
  - 可以
  - 是
  - 有
  - 好的
  - 好

# 高风险短反馈 / 关键 token（有无差异即 conflict）
critical_tokens:
  - 不需要
  - 不要
  - 不用
  - 没有
  - 需要
  - 嗯嗯
  - 嗯
  - 啊
  - 有
  - 是
  - 对
  - 好
  - 没
  - 不
  - 要

# 脏话 / 拒绝被正向化（rejection_sanitization）
profanity_or_reject:
  - 滚
  - 傻逼
  - 他妈
  - 去死
  - 别打电话
  - 别再打
  - 别再打电话
  - 打错了
  - 骚扰
  - 骗子
  - 烦死了
  - 闭嘴
