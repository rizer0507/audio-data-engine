# 语音信箱 / 电话助理类转写识别（classify：需 ≥2 模型族命中才进 voicemail）
# 在任意 ASR 转写文本上匹配（去标点后的 plain text + 可选 raw_text）。
name: voicemail_patterns_v1
version: 2
flags: IGNORECASE
patterns:
  # 语音信箱 / 留言
  - 语音信箱
  - 请(?:留言|留下您的姓名|留下姓名|留下电话|留下您的电话)
  - (?:您的)?留言(?:已|已经)?(?:录完|记录|收到)
  - 嘀(?:一声|声)后
  - 滴(?:一声|声)后
  - 提示音后

  # 电话助手 / 助理 / 秘书台（ASR 常把「助手」听成「助理」）
  - 电话助[理手]
  - 智能(?:语音)?助[理手]
  - 机主(?:的)?电话助[理手]
  - 我是机主
  - 您好?我是机主
  - 机主(?:现在|目前)?(?:忙|不在|不方便)
  - 有什么事要找他
  - 请问你找他什么事
  - 你找他什么事
  - 秘书台
  - 总机

  # 转接 / 转至（运营商彩铃常见「通话已转至语音信箱」；ASR 常残缺）
  - 电话已转接
  - 通话已转至
  - 通话移转
  - (?:已|已经)?转至(?:于|语|与|语音|信箱)?
  - (?:正在|已经|已)转接
  - 转接中
  - 为您转接
  - 请稍候.*转接

  # 无法接通 / 占线 / 关机
  - 无法接通
  - 暂时无法接通
  - 无人接听
  - 正在通话中
  - 用户正忙
  - 占线
  - 已关机
  - 不在服务区
  - 空号
  - 停机

  # IVR / 按键导航常见话术
  - 请按\d
  - 人工服务
  - 自助服务
  - 欢迎致电
