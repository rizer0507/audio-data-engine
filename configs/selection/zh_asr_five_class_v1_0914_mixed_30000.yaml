# 027 / 0914-mixed-30000 五类分拣影子配置。
# 复用已有三族双跑 ASR；不重跑 GPU ASR；不覆盖 classified_v3_* / 审核包 / release。
policy_version: selection_five_class_v1_0914_mixed_30000
engine: consensus_v3
rule_version: selection_five_class_v1
target_family: qwen

model_families:
  glm:
    - glm-base-1
    - glm-base-2
  sensevoice:
    - sv-base-1
    - sv-base-2
  qwen:
    - qwen-basr-1
    - qwen-basr-2

teacher_families:
  - glm
  - sensevoice

expected_runs_per_family: 2

run_aliases:
  glm-base-1: glm
  glm-base-2: glm
  sv-base-1: sensevoice
  sv-base-2: sensevoice
  qwen-basr-1: qwen
  qwen-basr-2: qwen

similarity:
  family_threshold: 0.98
  teacher_consensus_threshold: 0.98
  pseudo_high_min_similarity: 0.98
  pseudo_medium_min_similarity: 0.95
  pseudo_medium_min_stable_families: 3

short_utterance:
  max_audio_sec: 2.0
  max_text_chars: 6

speech_rate:
  max_chars_per_sec: 25
  min_text_chars: 80
  disposition: exclude

quality:
  calibrated: false
  noise_policy: asr_anomaly_noise_v1

selection:
  seed: selection_five_class_v1
  min_stable_families: 3
  short_polarity_max_han_chars: 4
  family_weights:
    qwen: 2
    glm: 1
    sensevoice: 1

classify_text:
  policy: five_class_v1
  keep_digits: true
  echo_missing: fail
  echo:
    qwen:
      asr_config: configs/asr/qwen_asr.yaml
      blank_exact: configs/normalization/blank_exact_qwen_v1.yaml
    glm:
      asr_config: configs/asr/glm.yaml
    sensevoice:
      asr_config: configs/asr/sensevoice.yaml

semantic_lexicon_path: configs/selection/semantic_lexicon_zh_v3.yaml
voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml

defaults:
  label_broken: false
