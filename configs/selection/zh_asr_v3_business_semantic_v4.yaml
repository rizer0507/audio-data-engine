# 024 业务语义优先。显式规则，不替换 selection_v3.0 或 022。
# 自动类不是人工 accepted，也不能进入正式逐字评测。
policy_version: selection_zh_asr_v3_business_semantic_v4
engine: consensus_v3
rule_version: selection_business_semantic_v4
target_family: qwen
prior_information_used: true

model_families:
  glm:
    - glm_1
    - glm_2
  sensevoice:
    - sensevoice_1
    - sensevoice_2
  qwen:
    - qwen_1
    - qwen_2

teacher_families:
  - glm
  - sensevoice

expected_runs_per_family: 2

run_aliases:
  glm_1: glm
  glm_2: glm
  sensevoice_1: sensevoice
  sensevoice_2: sensevoice
  qwen_1: qwen
  qwen_2: qwen

similarity:
  family_threshold: 0.98
  teacher_consensus_threshold: 0.98
  pseudo_high_min_similarity: 0.98
  pseudo_medium_min_similarity: 0.95
  pseudo_medium_min_stable_families: 3

short_utterance:
  max_audio_sec: 2.0
  max_text_chars: 6

speech_rate:
  max_chars_per_sec: 25
  min_text_chars: 80
  disposition: route_quarantine

quality:
  calibrated: false
  noise_policy: asr_anomaly_noise_v1

tolerance:
  version: text_tolerance_v1
  recall_max_distance: 0.10
  divergence_min_distance: 0.25
  short_max_chars: 6
  homophone_pairs:
    - [先声, 先生]
    - [嘀声, 滴声]
    - [嘀一声, 滴一声]

# The integer check is 3*k >= 2*m. This decimal is retained only so older
# readers can see why 0.6666667 must not be the gate.
consensus:
  min_support_families: 2
  min_support_ratio: 0.6666667

semantic_verifier:
  mode: business_local
  endpoint: ""
  protocol: auto
  model: ""
  timeout_sec: 5
  # 文本核验可选：配置 endpoint 或环境变量 AUDIO_ENGINE_SEMANTIC_VERIFIER_ENDPOINT。
  # 只接受 /compare 或 /v1/chat/completions。禁止把 QWEN_ASR_API_BASE 当聊天接口。
  # 未配置时本地规则处理残余，unknown 不自动通过。

semantic_lexicon_path: configs/selection/semantic_lexicon_zh_v3.yaml
voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml
voicemail_strong_path: configs/selection/voicemail_strong_v1.yaml
max_route_retries: 1

defaults:
  label_broken: false
