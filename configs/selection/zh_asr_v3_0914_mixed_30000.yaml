# selection_v3.0 — 0914-mixed-30000 三族方案 B
# 别名与 transcripts 键一致；不要求第四族 Kimi（015）。
policy_version: selection_zh_asr_v3_0
engine: consensus_v3
rule_version: selection_v3.0
target_family: qwen

model_families:
  glm:
    - glm-base-1
    - glm-base-2
  sensevoice:
    - sv-base-1
    - sv-base-2
  qwen:
    - qwen-basr-1
    - qwen-basr-2

teacher_families:
  - glm
  - sensevoice

expected_runs_per_family: 2

run_aliases:
  glm-base-1: glm
  glm-base-2: glm
  sv-base-1: sensevoice
  sv-base-2: sensevoice
  qwen-basr-1: qwen
  qwen-basr-2: qwen

similarity:
  family_threshold: 0.98
  teacher_consensus_threshold: 0.98
  pseudo_high_min_similarity: 0.98
  pseudo_medium_min_similarity: 0.95
  pseudo_medium_min_stable_families: 3

short_utterance:
  max_audio_sec: 2.0
  max_text_chars: 6

speech_rate:
  max_chars_per_sec: 25
  min_text_chars: 80
  disposition: exclude

quality:
  calibrated: false
  # classify_dataset_v3_asr_anomaly_noise 入口会覆盖为 asr_anomaly_noise_v1
  noise_policy: legacy_full_quality_gate

semantic_lexicon_path: configs/selection/semantic_lexicon_zh_v3.yaml
voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml

defaults:
  label_broken: false
