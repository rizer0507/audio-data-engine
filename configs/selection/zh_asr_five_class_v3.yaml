# 五类分拣 v3（业务正式名）= 037 按需声学实现
# 工程兼容 ID：selection_five_class_v2_4_on_demand_acoustic（同实现）
# ASR 预分流 A—E → 按需 Silero VAD → 按需严格全零 energy → 按需 DNSMOS(SIG)
# EfficientAT 不在默认主路径。家族集合=配置全部家族×双跑（当前工程三族六路）。
# 独立产物 stem：*_five_class_v3_*；勿覆盖 v2.4/v2.3/v2.2/v2/v1 / 旧 classified_v3_* / 审核包 / release。
# 规范：docs/02-规范规则/数据挑选规则_v3.md
policy_version: selection_five_class_v3
engine: consensus_v3
rule_version: selection_five_class_v3
target_family: qwen

model_families:
  glm:
    - glm_1
    - glm_2
  sensevoice:
    - sensevoice_1
    - sensevoice_2
  qwen:
    - qwen_1
    - qwen_2

teacher_families:
  - glm
  - sensevoice

expected_runs_per_family: 2

run_aliases:
  glm_1: glm
  glm_2: glm
  sensevoice_1: sensevoice
  sensevoice_2: sensevoice
  qwen_1: qwen
  qwen_2: qwen

similarity:
  family_threshold: 0.98
  teacher_consensus_threshold: 0.98
  pseudo_high_min_similarity: 0.98
  pseudo_medium_min_similarity: 0.95
  pseudo_medium_min_stable_families: 3

short_utterance:
  max_audio_sec: 2.0
  max_text_chars: 6

speech_rate:
  max_chars_per_sec: 25
  min_text_chars: 80
  disposition: exclude

quality:
  calibrated: false
  noise_policy: asr_anomaly_noise_v1

selection:
  seed: selection_five_class_v3
  min_stable_families: 2
  short_polarity_max_han_chars: 4
  family_weights:
    qwen: 2
    glm: 1
    sensevoice: 1
  critical_short_responses:
    - 要
    - 不要
    - 需要
    - 不需要
    - 好
    - 不好
    - 可以
    - 不可以
    - 行
    - 不行
    - 是
    - 不是
    - 有
    - 没有
    - 用
    - 不用
    - 好的
    - 嗯
    - 对

audio_energy:
  config_path: configs/quality/audio_energy_v1.yaml

silero_vad:
  config_path: configs/quality/silero_vad_v1.yaml

dnsmos_decision:
  enabled: false
  config_path: configs/quality/dnsmos_decision_v2_2.yaml

classify_text:
  policy: five_class_v1
  keep_digits: true
  echo_missing: fail
  echo:
    qwen:
      asr_config: configs/asr/qwen_asr.yaml
      blank_exact: configs/normalization/blank_exact_qwen_v1.yaml
    glm:
      asr_config: configs/asr/glm.yaml
    sensevoice:
      asr_config: configs/asr/sensevoice.yaml

semantic_lexicon_path: configs/selection/semantic_lexicon_zh_v3.yaml
voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml

defaults:
  label_broken: false
