# selection_v3.0 / consensus_v3 — 三族双跑分拣示例（015）
# 与 zh_asr_v3.yaml（四族推荐）并行；N≥3 即可 classify_v3，不要求第四族 Kimi。
# 实测覆盖：N=3 / N=4；更多族须复核 teacher 阈值与 pseudo_medium_min_stable_families。
policy_version: selection_zh_asr_v3_0
engine: consensus_v3
rule_version: selection_v3.0
target_family: qwen

model_families:
  glm:
    - glm_1
    - glm_2
  sensevoice:
    - sensevoice_1
    - sensevoice_2
  qwen:
    - qwen_1
    - qwen_2

teacher_families:
  - glm
  - sensevoice

expected_runs_per_family: 2

similarity:
  family_threshold: 0.98
  teacher_consensus_threshold: 0.98
  pseudo_high_min_similarity: 0.98
  pseudo_medium_min_similarity: 0.95
  # 三族时「≥3 stable」即配置内全族；四族时仍为至少三族
  pseudo_medium_min_stable_families: 3

short_utterance:
  max_audio_sec: 2.0
  max_text_chars: 6

quality:
  calibrated: false

semantic_lexicon_path: configs/selection/semantic_lexicon_zh_v3.yaml
voicemail_patterns_path: configs/selection/voicemail_patterns_v1.yaml

defaults:
  label_broken: false
