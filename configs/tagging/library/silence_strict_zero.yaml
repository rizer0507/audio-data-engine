tag_id: silence_strict_zero
version: '1'
status: enabled
name: 严格全零静默
description: '只有整段录音中每个声道的采样值都为 0，才打这个标签。

  声音很小但不为 0，不算；没有检测结果时，无法判断。'
business_definition: '严格全通道采样值为零（capability: strict_all_channels_zero），与「低能量」不等同。

  依赖能量/静默类声学证据；existing 模式缺证据为 unknown。

  '
dependencies:
  fragments: []
  lexicons: []
  requires_acoustic: true
examples:
