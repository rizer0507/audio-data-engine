# 中性 ASR 家族证据 v2（044）— 自 zh_asr_five_class_v3 有效值迁移，不含分拣业务队列/配额。
policy_version: zh_asr_families_v2

model_families:
  glm:
    - glm_1
    - glm_2
  sensevoice:
    - sensevoice_1
    - sensevoice_2
  qwen:
    - qwen_1
    - qwen_2

expected_runs_per_family: 2

run_aliases:
  glm_1: glm
  glm_2: glm
  sensevoice_1: sensevoice
  sensevoice_2: sensevoice
  qwen_1: qwen
  qwen_2: qwen

similarity:
  family_threshold: 0.98

classify_text:
  policy: five_class_v1
  keep_digits: true
  echo_missing: fail
  echo:
    qwen:
      asr_config: configs/asr/qwen_asr.yaml
      blank_exact: configs/normalization/blank_exact_qwen_v1.yaml
    glm:
      asr_config: configs/asr/glm.yaml
    sensevoice:
      asr_config: configs/asr/sensevoice.yaml

punctuation_to_strip:
  - "，"
  - "。"
  - "！"
  - "？"
  - "、"
  - "；"
  - "："
  - '"'
  - '"'
  - "'"
  - "'"
  - "（"
  - "）"
  - "【"
  - "】"
  - "《"
  - "》"
  - "…"
  - "—"
  - "·"
  - ","
  - "."
  - "!"
  - "?"
  - ";"
  - ":"
  - "'"
  - '"'
  - "("
  - ")"
  - "["
  - "]"
  - "{"
  - "}"

critical_short_responses:
  - 要
  - 不要
  - 需要
  - 不需要
  - 好
  - 不好
  - 可以
  - 不可以
  - 行
  - 不行
  - 是
  - 不是
  - 有
  - 没有
  - 用
  - 不用
  - 好的
  - 嗯
  - 对

dnsmos_weak_sig: 2.8

voicemail_patterns_path: configs/tagging/lexicons/voicemail_patterns_v1.yaml

# 极性 / 关键 token / 填充词词表（自 configs/selection 复制，运行期不再读 selection 目录）
semantic_lexicon_path: configs/tagging/lexicons/semantic_lexicon_zh_v3.yaml

audio_energy:
  config_path: configs/quality/audio_energy_v1.yaml

silero_vad:
  config_path: configs/quality/silero_vad_v1.yaml

dnsmos_decision:
  enabled: false
  config_path: configs/quality/dnsmos_decision_v2_2.yaml

dnsmos_scoring:
  config_path: configs/quality/dnsmos_p835.yaml
