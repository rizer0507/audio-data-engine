# 工序③：在多 ASR Manifest 上执行 selection_v1.1 共识分拣（type/decision/label）。
# 配置：configs/selection/zh_asr_v1.yaml（engine: consensus_v1）
name: classify_dataset
input:
  manifest: datasets/manifests/multi_asr_metrics_source_A.parquet
output:
  manifest: datasets/manifests/classified_source_A.parquet
execution:
  executor: sequential
  workers: 1
pipeline:
  - name: classify
    operator: quality.classify
    params:
      config_path: configs/selection/zh_asr_v1.yaml
