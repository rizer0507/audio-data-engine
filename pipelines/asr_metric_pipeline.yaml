# （legacy / 诊断）字准 / agreement CER。生产 ASR batch 已在落盘时清洗（048）；
# 本流水线仍可对历史脏数据补洗，或对已清洗数据再跑一遍（normalize 幂等）后算 CER。
#
#   audio-data pipeline run pipelines/asr_metric_pipeline.yaml \
#     --source-name mt3000 --agreement-base qwen1
#   → multi_asr_aggregate_mt3000 → multi_asr_metrics_mt3000.parquet
#
# 配置：configs/normalization/blank_exact_qwen_v1.yaml
#       + configs/metrics/gold_agreement.yaml（vs_base）+ configs/normalization/zh_asr_v1.yaml
# 兼容：不传 --source-name 时使用下方写死路径。

name: asr_metric_pipeline
input:
  manifest: datasets/stage1/derived/multi_asr_aggregate_source_A.parquet
output:
  manifest: datasets/stage1/derived/multi_asr_metrics_source_A.parquet
pipeline:
  - name: normalize_transcripts
    operator: quality.normalize_transcripts
    params:
      keep_raw: true
      blank_exact_hotwords_path: configs/normalization/blank_exact_qwen_v1.yaml
  - name: agreement_metrics
    operator: quality.text_metrics
    params:
      config_path: configs/metrics/gold_agreement.yaml
      normalization_path: configs/normalization/zh_asr_v1.yaml
      # agreement_base: qwen1  # 也可用 CLI --agreement-base 覆盖
