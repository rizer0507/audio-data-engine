# 023 × 022：语义容错分拣 + ASR 异常噪声诊断。
# 不覆盖 classified_v3_*_semantic_tolerant_20260911.parquet。
#
#   audio-data pipeline run pipelines/classify_dataset_v3_semantic_tolerant_asr_anomaly_noise.yaml \
#     --source-name 0908-30000 \
#     --config configs/selection/zh_asr_v3_0908_30000_semantic_tolerant.yaml
#
# 文本分拣、金标选文、语义风险必审仍按 022。噪声触发、未评分状态、质量门禁以 023 为准。
# 回退文本规则（不跑本诊断）：pipelines/classify_dataset_v3_semantic_tolerant.yaml
# 回退旧质量门禁：pipelines/classify_dataset_v3.yaml + noise_policy: legacy_full_quality_gate

name: classify_dataset_v3_semantic_tolerant_asr_anomaly_noise
input:
  manifest: datasets/stage1/derived/prepared_asr_v3_source_A.parquet
output:
  manifest: datasets/stage1/derived/classified_v3_source_A_semantic_tolerant_20260911_asr_anomaly_noise_v1.parquet
execution:
  executor: sequential
  workers: 1
  fail_fast: false
pipeline:
  - name: diagnose_asr_anomaly
    operator: quality.asr_anomaly_noise
    params:
      config_path: configs/selection/zh_asr_v3_semantic_tolerant.yaml
      selection_config: configs/selection/zh_asr_v3_semantic_tolerant.yaml
      dnsmos_config: configs/quality/dnsmos_p835.yaml
  - name: classify
    operator: quality.classify
    params:
      config_path: configs/selection/zh_asr_v3_semantic_tolerant.yaml
      noise_policy: asr_anomaly_noise_v1
      quality:
        calibrated: false
        noise_policy: asr_anomaly_noise_v1
