# 全量豆包 ASR（HTTP submit + poll；无需本地 GPU）
#
#   audio-data pipeline run pipelines/doubao_asr_batch.yaml --source-name local_test
#   → cleaned_local_test → doubao_asr_local_test.parquet
#
# 并发预算（纯 HTTP，无 GPU 限制，主要受豆包账号 QPS/配额约束）：
#   总并发 ≈ parallel_shards × concurrency
#   默认 8 × 16 = 128 路；若出现 429/超时，先降 concurrency 再降 parallel_shards
#
# 加速已跑过的任务（checkpoint 续跑，已转写样本走 cache）：
#   audio-data pipeline run pipelines/doubao_asr_batch.yaml --source-name local_test \
#     --resume runs/<上次_run_root>

name: doubao_asr_batch

input:
  manifest: datasets/manifests/cleaned_source_A.parquet

output:
  manifest: datasets/manifests/doubao_asr_source_A.parquet

execution:
  executor: thread
  workers: 16
  fail_fast: false
  checkpoint_every: 100

sharding:
  shards: 16
  strategy: duration-balanced
  parallel_shards: 8
  workers: 16
  executor: thread

pipeline:
  - name: doubao_asr
    operator: asr.doubao_batch
    params:
      input_audio_key: resampled_16k
      transcript_key: doubao
      config_path: configs/asr/doubao.yaml
      concurrency: 16
      batch_size: 16
