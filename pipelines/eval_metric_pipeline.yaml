# 工序⑤：已按 id 聚拢的评测 Manifest 上，相对 gold_text 算多模型字准并导出。
#
#   audio-data pipeline run pipelines/eval_metric_pipeline.yaml \
#     --eval-name eval_local_test \
#     --eval-model qwen --eval-model qwen-sft-epoch10 --eval-model qwen-sft-epoch100
#
# 不传 --eval-model 时，对样本上全部 transcript key（除 gold）算字准。
# xlsx「按type统计」末两列：非 base 模型相对 base 的总体/平均字准率差值；
# base 默认为第一个 --eval-model（也可用 evaluation_report.params.base_prefix 指定）。
# 与训练 / Model Registry 无依赖。
#
# 012-E：business_metrics_v1（NFR/FAR/…）写入 evaluation.json；
# 缺校准门禁阈值时 publish_status=needs_review，不自动 pass。
# 正式比较请固定 baseline_prefix / candidate_prefix；任一模型 failed/missing → incomplete。

name: eval_metric_pipeline
input:
  manifest: datasets/stage3/derived/eval_aggregate_source_A.parquet
output:
  manifest: datasets/stage3/derived/eval_metrics_source_A.parquet
pipeline:
  - name: normalize_transcripts
    operator: quality.normalize_transcripts
    params:
      keep_raw: true
      blank_exact_hotwords_path: configs/normalization/blank_exact_eval_interview_v1.yaml
  - name: evaluation_metrics
    operator: quality.text_metrics
    params:
      config_path: configs/metrics/model_eval.yaml
      normalization_path: configs/normalization/zh_asr_v1.yaml
      skip_missing_reference: true
  - name: evaluation_report
    operator: quality.evaluation_report
    params:
      bucket_key: type
      allow_missing_gold: true
      export_xlsx: true
      fail_on_regression: false
      enable_business_metrics: true
      business_metrics_config: configs/metrics/business_risk_v1.yaml
      # 正式门禁比较时指定（也可用 CLI 注入 params）：
      # baseline_prefix: qwen
      # candidate_prefix: qwen-sft-epoch10
      fail_on_business_gate: false
