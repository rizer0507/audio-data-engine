# 自由标签体系 v2 生产打标（044）
# 默认已有证据模式；不重跑 ASR。纯文本规则无需 GPU。
# 生产入口：
#   audio-data pipeline run pipelines/tag_dataset_free_tags_v2.yaml \
#     --source-name "$BATCH" \
#     --config configs/tagging/zh_asr_free_tags_v2.yaml
#
# 输入：优先 prepared_evidence_<batch>（045）；兼容 prepared_asr_v3_<batch>。
#       禁止 classified_* / quality_sidecar_* 自动回退。
# 输出：datasets/stage1/derived/tagged_free_tags_v2_<batch>.parquet
#       data/exports/summary_free_tags_v2_<batch>.xlsx
#       runs/tagging/<batch>/free_tags_v2/（状态/缓存/发布快照）
# evidence_mode=existing：消费已提交 DNSMOS，不隐式重跑评分。

name: tag_dataset_free_tags_v2
input:
  manifest: datasets/stage1/derived/prepared_evidence_source_A.parquet
output:
  manifest: datasets/stage1/derived/tagged_free_tags_v2_source_A.parquet
execution:
  executor: sequential
  workers: 1
  fail_fast: false
  checkpoint_every: 500
pipeline:
  - name: multi_tag
    operator: quality.multi_tag_v1
    params:
      config_path: configs/tagging/zh_asr_free_tags_v2.yaml
      tagging_config: configs/tagging/zh_asr_free_tags_v2.yaml
      batch_id: source_A
      evidence_mode: existing
      publish: true
      # TaggingService 内部并发；与整批算子的外层 execution 分开。
      executor: auto
      workers: 8
      checkpoint_every: 100
      batch_size: 32
      retain_results: false
      # 声学补算时各引擎独立限额；existing 模式不会启动这些模型池。
      engine_workers: {vad: 4, dnsmos: 4, energy: 8}
      engine_max_in_flight: {vad: 8, dnsmos: 8, energy: 16}
      engine_retries: 0
      summary_xlsx: data/exports/summary_free_tags_v2_source_A.xlsx
      output_manifest: datasets/stage1/derived/tagged_free_tags_v2_source_A.parquet
