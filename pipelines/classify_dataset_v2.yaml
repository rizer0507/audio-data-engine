# 工序③：selection_v2.0 / consensus_v2 分拣（与 v1 并行，默认生产仍用 classify_dataset.yaml）
# 配置：configs/selection/zh_asr_v2.yaml
name: classify_dataset_v2
input:
  manifest: datasets/stage1/derived/multi_asr_metrics_source_A.parquet
output:
  manifest: datasets/stage1/derived/classified_v2_source_A.parquet
execution:
  executor: sequential
  workers: 1
pipeline:
  - name: classify
    operator: quality.classify
    params:
      config_path: configs/selection/zh_asr_v2.yaml
