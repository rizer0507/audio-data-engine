# Qwen-ASR 输出之上的 SenseVoice 批量识别阶段。
#
# 一条命令：audio-data pipeline run pipelines/sensevoice_asr_batch.yaml
# 前置：input 须含 resampled_16k + transcripts.qwen
# 环境变量：SENSEVOICE_MODEL_PATH

name: sensevoice_asr_batch

input:
  manifest: datasets/manifests/qwen_asr_source_A.parquet

output:
  manifest: datasets/manifests/qwen_sensevoice_source_A.parquet

execution:
  executor: sequential
  workers: 1
  # 模型没有加载成功时立即终止，避免整批样本被静默标记失败后继续跑完。
  fail_fast: true
  checkpoint_every: 500

sharding:
  shards: 4
  strategy: duration-balanced
  parallel_shards: 4
  gpus: [4, 5, 6, 7]
  instances_per_gpu: 1
  workers: 1
  executor: sequential

pipeline:
  - name: sensevoice_asr
    operator: asr.sensevoice_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/sensevoice.yaml
