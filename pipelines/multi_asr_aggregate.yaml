# 工序②：仅按 id 聚合各个独立 ASR 结果 Manifest；不执行推理或指标计算。
#
#   audio-data pipeline run pipelines/multi_asr_aggregate.yaml \
#     --source-name mt3000 \
#     --aggregate-base qwen1 \
#     --join-manifest qwen2 --join-manifest sensevoice1
#   → base: qwen1_asr_mt3000.parquet
#   → join: qwen2_asr_mt3000 / sensevoice1_asr_mt3000
#   → out:  multi_asr_aggregate_mt3000.parquet
#
# 任意结果别名（--asr-run）只要与 --source-name 同源即可聚拢；不绑死模型清单。
# 兼容：不传 --aggregate-base 时底表仍为 qwen_asr_<source>；不传 --source-name 时用下方路径。

name: multi_asr_aggregate
input:
  manifest: datasets/manifests/qwen_asr_source_A.parquet
output:
  manifest: datasets/manifests/multi_asr_aggregate_source_A.parquet
execution:
  executor: sequential
  workers: 1
  fail_fast: true
pipeline:
  - name: aggregate_asr_results
    operator: quality.aggregate_manifests
    params:
      manifests:
        - model: sensevoice
          path: datasets/manifests/sensevoice_asr_source_A.parquet
      overwrite: false
