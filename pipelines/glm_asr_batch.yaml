# 工序②：全量 GLM-ASR（vLLM HTTP；与其他模型独立）
#
#   audio-data pipeline run pipelines/glm_asr_batch.yaml --source-name mt3000
#   → cleaned_mt3000 → glm_asr_mt3000.parquet
#
# 兼容：不传 --source-name 时使用下方写死路径。
# 前置：
#   1. input 须含 resampled_16k
#   2. 先启动 vLLM（每卡一份，TP=1；不要 --tensor-parallel-size 2）
#   3. scripts/probe_glm_vllm.py 三档探针均通过
#      （短 WAV；目录 --concurrency；同一条 --repeat 2）
#      见 docs/07-操作手册/GLM-ASR-vLLM识别流水线.md
#
# 环境变量：
#   GLM_ASR_API_BASE     一台或多台，逗号分隔
#                        例：http://127.0.0.1:5570,http://127.0.0.1:5571
#   GLM_ASR_API_BASES    同上（优先于单值写法）
#   GLM_ASR_MODEL        默认 glm-asr（与 --served-model-name 一致）
#   GLM_ASR_API_KEY      可选，默认 dummy
#
# 并行（在途 HTTP ≈ 各副本 --max-num-seqs 之和）：
#   - 单副本默认 1 shard × concurrency 8
#   - 两副本同权重：YAML 改成 2 shard，API_BASE 写两个端口
#   - 不要 8 shard × 高 concurrency 去打一台 seq=2 的服务
#   - 客户端不占 GPU；不要写 gpus / instances_per_gpu
#
# 产物契约：transcripts.glm / glm_asr_<source>.parquet；join 名 glm。

name: glm_asr_batch

input:
  manifest: datasets/stage1/cleaned/cleaned_source_A.parquet

output:
  manifest: datasets/stage1/asr/glm_asr_source_A.parquet

execution:
  executor: thread
  workers: 4
  fail_fast: false
  checkpoint_every: 500

sharding:
  shards: 1
  strategy: duration-balanced
  parallel_shards: 1
  workers: 4
  executor: thread

pipeline:
  - name: glm_asr
    operator: asr.glm_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/glm.yaml
