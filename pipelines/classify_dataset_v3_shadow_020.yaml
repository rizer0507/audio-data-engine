# 020 影子分拣：不覆盖 classified_v3_*；启用 route_quarantine + refactor_020_mode=on
#
#   audio-data pipeline run pipelines/classify_dataset_v3_shadow_020.yaml \
#     --source-name 0908-30000 \
#     --config configs/selection/zh_asr_v3_0908_30000.yaml
#
# 产物：datasets/stage1/derived/classified_v3_<BATCH>_shadow_020.parquet

name: classify_dataset_v3_shadow_020
input:
  manifest: datasets/stage1/derived/prepared_asr_v3_source_A.parquet
output:
  manifest: datasets/stage1/derived/classified_v3_source_A_shadow_020.parquet
execution:
  executor: sequential
  workers: 1
  fail_fast: true
pipeline:
  - name: classify
    operator: quality.classify
    params:
      config_path: configs/selection/zh_asr_v3.yaml
      refactor_020_mode: "on"
      speech_rate:
        max_chars_per_sec: 25
        min_text_chars: 80
        disposition: route_quarantine
      quality:
        calibrated: false
