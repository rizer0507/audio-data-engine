# 023 默认分拣入口：ASR 异常触发噪声诊断，然后按文本规则分拣。
# 不调用全量 DNSMOS。正常中文样本状态为 not_required，不因缺评分失去候选资格。
# 产物独立，不覆盖 classified_v3_* / 审核包 / release。
#
#   audio-data pipeline run pipelines/classify_dataset_v3_asr_anomaly_noise.yaml \
#     --source-name 0908-30000 \
#     --config configs/selection/zh_asr_v3_0908_30000.yaml
#
# 旧全量质量门禁回退：pipelines/classify_dataset_v3.yaml
#   配置须显式 noise_policy: legacy_full_quality_gate，且可选先跑 audio_quality_sidecar.yaml。
# 失败时禁止改回全量评分。业务噪声等级未听音校准，不得标 calibrated=true。

name: classify_dataset_v3_asr_anomaly_noise
input:
  manifest: datasets/stage1/derived/prepared_asr_v3_source_A.parquet
output:
  manifest: datasets/stage1/derived/classified_v3_source_A_asr_anomaly_noise_v1.parquet
execution:
  executor: sequential
  workers: 1
  fail_fast: false
pipeline:
  - name: diagnose_asr_anomaly
    operator: quality.asr_anomaly_noise
    params:
      config_path: configs/selection/zh_asr_v3.yaml
      selection_config: configs/selection/zh_asr_v3.yaml
      dnsmos_config: configs/quality/dnsmos_p835.yaml
  - name: classify
    operator: quality.classify
    params:
      config_path: configs/selection/zh_asr_v3.yaml
      noise_policy: asr_anomaly_noise_v1
      quality:
        calibrated: false
        noise_policy: asr_anomaly_noise_v1
