# 数据清洗流水线：规范化（16k mono ch0）+ FSMN VAD 切段（041）
#
# 推荐（按批次名统一产物命名，无需改本文件路径）：
#   audio-data pipeline run pipelines/data_cleaning_source_A.yaml \
#     --source-name mt3000 \
#     --source-dir /path/to/wav_or_pcm
#   → datasets/stage1/cleaned/cleaned_mt3000.parquet|.jsonl  （片段样本，丢弃无 end 的 EOF 补尾）
#
# 模型（生产）：
#   export FSMN_VAD_SOURCE_MODEL_DIR=/data2/data-cp/xijujun/models/fsmn-vad
#   # 首次：python scripts/prepare_fsmn_vad_runtime.py \
#   #   --source-model-dir "$FSMN_VAD_SOURCE_MODEL_DIR" \
#   #   --fenshen-config configs/vad/fenshen_vad_config.yaml \
#   #   --runtime-dir var/models/fsmn-vad-fenshen-v1
#   export FSMN_VAD_RUNTIME_DIR="$PWD/var/models/fsmn-vad-fenshen-v1"
#
# 工程 mock（无 FunASR 时）：params.mock=true 或环境 AUDIO_ENGINE_VAD_MOCK=1
#
# 声道：多声道只取第0声道；无头 PCM 默认单声道；声明多声道时先解交织再取 ch0。
# 采样率：输出统一 16k；无头默认 source_sample_rate=16000；有头读文件头。
#         真实 8k 会明显告警并重采样，source/normalized 分字段记录。
#
# 兼容旧用法：不传 --source-name 时，仍读下方 input.source / output.manifest
#   （input.source 见 resources/manifest.yaml）

name: data_cleaning_source_A

input:
  source: source_A

output:
  manifest: datasets/stage1/cleaned/cleaned_source_A.parquet

# 步骤内样本级并发（子进程内生效；ManifestOperator 始终串行）
# 开了 sharding 时，子进程实际以 sharding.workers 为准
execution:
  executor: thread
  workers: 32
  max_in_flight: 128
  fail_fast: false
  checkpoint_every: 5000

# 顶层分片并行：一条 pipeline run 即完成 split+run+merge（无 GPU）
# 128 核：约 64 进程 × 每进程 16 线程；磁盘抖则把 parallel_shards 降到 32
sharding:
  shards: 8
  strategy: hash
  parallel_shards: 16
  workers: 16
  executor: thread

pipeline:
  - name: ingest
    operator: ingest.scan

  - name: pcm_convert
    operator: audio.pcm_to_wav
    execution:
      workers: 32
    params:
      # sample_rate = 规范输出目标（全局 16 kHz）。
      # source_sample_rate 仅用于无头 pcm/raw（默认 16k；可信来源声明 8k 时改这里）。
      # channels：无头默认 1；可信来源声明多声道时设真实声道数，算子解交织后只取 ch0。
      sample_rate: 16000
      source_sample_rate: 16000
      channels: 1
      input_audio_key: raw
      output_audio_key: pcm_wav

  - name: resample
    operator: audio.resample
    execution:
      workers: 32
    params:
      sample_rate: 16000
      input_audio_key: pcm_wav
      output_audio_key: resampled_16k

  - name: normalize_report
    operator: audio.normalize_report

  - name: probe
    operator: quality.probe
    execution:
      workers: 48
    params:
      input_audio_key: resampled_16k

  - name: audio_pass
    operator: quality.filter
    params:
      expr: "label_broken != True and duration > 0"
      label_key: audio_pass

  - name: select_pass
    operator: quality.select
    params:
      expr: "label_audio_pass == True"

  # 一对多（049）：与分身 fenshen 实时服务对齐——100ms 分包/每两包推理、
  # split-end<=150ms 与完整端点 pending<=200ms 分支过滤、无 675ms 尾、无统一 1s 门限；
  # send_end_result=true 时 pending 在 EOF 补尾发布。产物 cleaned_* 为片段 Manifest。
  # 路径由算子读取环境变量（YAML 不展开 ${}）：
  #   FSMN_VAD_RUNTIME_DIR / FSMN_VAD_SOURCE_MODEL_DIR / FSMN_VAD_FENSHEN_CONFIG
  #   AUDIO_ENGINE_VAD_MOCK=1 → 工程 mock
  - name: fsmn_vad_segment
    operator: audio.fsmn_vad_segment
    params:
      input_audio_key: resampled_16k
      output_audio_key: resampled_16k
      channel_index: 0
      packet_ms: 100
      send_end_result: true
      prepare_runtime: false
      verify_fingerprints: true
      source_results_dir: vad_source_results
      segments_subdir: vad_segments
