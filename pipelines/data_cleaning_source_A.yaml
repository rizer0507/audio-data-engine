# 数据清洗流水线：只做音频质量，不做标注决策
#
# 输入：已登记的逻辑数据源 source_A（见 resources/manifest.yaml）
#   - 若已有样本索引 → 直接加载
#   - 若仅有外部 path → 父进程先 ingest.scan，再分片
# 输出：datasets/manifests/cleaned_source_A.parquet（仅 audio_pass 样本）
#
# 一条命令：audio-data pipeline run pipelines/data_cleaning_source_A.yaml
# sharding 自动完成 分片 → 多进程并行 → 合并

name: data_cleaning_source_A

input:
  source: source_A

output:
  manifest: datasets/manifests/cleaned_source_A.parquet

# 步骤内样本级并发（子进程内生效；ManifestOperator 始终串行）
execution:
  executor: thread
  workers: 4
  max_in_flight: 0
  fail_fast: false
  checkpoint_every: 1000

# 顶层分片并行：一条 pipeline run 即完成 split+run+merge（无 GPU）
sharding:
  shards: 32
  strategy: hash
  parallel_shards: 32
  workers: 8
  executor: thread

pipeline:
  - name: ingest
    operator: ingest.scan

  - name: pcm_convert
    operator: audio.pcm_to_wav
    execution:
      workers: 8
    params:
      sample_rate: 8000
      channels: 1
      input_audio_key: raw
      output_audio_key: pcm_wav

  - name: resample
    operator: audio.resample
    execution:
      workers: 4
    params:
      sample_rate: 16000
      input_audio_key: pcm_wav
      output_audio_key: resampled_16k

  - name: probe
    operator: quality.probe
    execution:
      workers: 16
    params:
      input_audio_key: resampled_16k

  - name: audio_pass
    operator: quality.filter
    params:
      expr: "label_broken != True and duration > 0"
      label_key: audio_pass

  - name: select_pass
    operator: quality.select
    params:
      expr: "label_audio_pass == True"
