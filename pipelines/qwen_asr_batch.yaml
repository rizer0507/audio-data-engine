# Qwen3-ASR 高吞吐识别流水线
#
# 前置：输入 manifest 必须已有 resampled_16k 音频 key。
# A800 80G：进程内 batch=32；四卡用 run-shards --gpus 0,1,2,3
# --instances-per-gpu 2 --parallel-shards 8，每张卡同时跑 2 个模型实例。

name: qwen_asr_batch

input:
  manifest: datasets/manifests/cleaned_source_A.parquet

output:
  manifest: datasets/manifests/qwen_asr_source_A.parquet

execution:
  executor: sequential
  workers: 1
  fail_fast: false
  checkpoint_every: 500

pipeline:
  - name: qwen_asr
    operator: asr.qwen_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/qwen_asr.yaml
