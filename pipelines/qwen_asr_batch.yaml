# Qwen3-ASR 高吞吐识别流水线
#
# 前置：输入 manifest 必须已有 resampled_16k 音频 key。
# 一条命令：audio-data pipeline run pipelines/qwen_asr_batch.yaml
# sharding 自动完成 时长均衡分片 → 多卡并行 → 合并。
# 按机器改 sharding.gpus / instances_per_gpu / shards（分片数 = GPU×每卡实例）。

name: qwen_asr_batch

input:
  manifest: datasets/manifests/cleaned_source_A.parquet

output:
  manifest: datasets/manifests/qwen_asr_source_A.parquet

execution:
  executor: sequential
  workers: 1
  fail_fast: false
  checkpoint_every: 500

sharding:
  shards: 8
  strategy: duration-balanced
  parallel_shards: 8
  gpus: [4, 5, 6, 7]
  instances_per_gpu: 2

pipeline:
  - name: qwen_asr
    operator: asr.qwen_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/qwen_asr.yaml
