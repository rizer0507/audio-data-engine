# 工序②-a：全量 Qwen3-ASR（先跑完本阶段，再跑 sensevoice_asr_batch）
#
# 推荐经编排入口：
#   audio-data pipeline run pipelines/multi_asr_aggregate.yaml --source-name mt3000
# 单独跑本文件时也可：
#   audio-data pipeline run pipelines/qwen_asr_batch.yaml --source-name mt3000
#   → cleaned_mt3000 → qwen_asr_mt3000
#
# 兼容：不传 --source-name 时使用下方写死路径。
# 前置：input 须含 resampled_16k
# 环境变量：QWEN_ASR_MODEL_PATH
# 并行约束：shards == parallel_shards <= len(gpus) * instances_per_gpu

name: qwen_asr_batch

input:
  manifest: datasets/manifests/cleaned_source_A.parquet

output:
  manifest: datasets/manifests/qwen_asr_source_A.parquet

execution:
  executor: sequential
  workers: 1
  fail_fast: false
  checkpoint_every: 500

sharding:
  shards: 8
  strategy: duration-balanced
  parallel_shards: 8
  gpus: [4, 5]
  instances_per_gpu: 4
  workers: 1
  executor: sequential

pipeline:
  - name: qwen_asr
    operator: asr.qwen_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/qwen_asr.yaml
