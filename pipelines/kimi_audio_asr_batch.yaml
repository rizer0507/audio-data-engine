# 工序②-c-local：全量 Kimi-Audio ASR（本地 kimia_infer 加载；与 vLLM 版 kimi_asr_batch 独立）
#
#   audio-data pipeline run pipelines/kimi_audio_asr_batch.yaml --source-name mt3000
#   → cleaned_mt3000 → kimi_audio_asr_mt3000.parquet
#
# 前置：
#   1. input 须含 resampled_16k
#   2. pip install 'audio-data-engine[kimi-audio]'（含 kimia_infer）
#
# 环境变量：
#   KIMI_AUDIO_MODEL_PATH   默认 configs/asr/kimi_audio.yaml 中的 model_path
#
# 并行约束：shards == parallel_shards <= len(gpus) * instances_per_gpu
# 不要在单进程内用 execution.workers 共享同一 GPU 模型；并发由 shard 进程控制。

name: kimi_audio_asr_batch

input:
  manifest: datasets/manifests/cleaned_source_A.parquet

output:
  manifest: datasets/manifests/kimi_audio_asr_source_A.parquet

execution:
  executor: sequential
  workers: 1
  fail_fast: true
  checkpoint_every: 500

sharding:
  shards: 8
  strategy: duration-balanced
  parallel_shards: 8
  gpus: [6]
  instances_per_gpu: 1
  workers: 1
  executor: sequential

pipeline:
  - name: kimi_audio_asr
    operator: asr.kimi_audio_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/kimi_audio.yaml

  - name: release_after_kimi_audio
    operator: runtime.release_asr_models
