# 工序②-c：全量 Kimi-Audio ASR（vLLM 服务；与其他模型独立）
#
#   audio-data pipeline run pipelines/kimi_asr_batch.yaml --source-name mt3000
#   → cleaned_mt3000 → kimi_asr_mt3000.parquet
#
# 前置：
#   1. input 须含 resampled_16k
#   2. 先启动 vLLM（见 docs/流水线改进/构造kimi-audio识别流水线.md）
#
# 环境变量：
#   KIMI_ASR_API_BASE   默认 http://127.0.0.1:5554
#   KIMI_ASR_MODEL        默认 kimi-audio（与 --served-model-name 一致）
#
# 并行：
#   - sharding 将数据切成多片，每片一个子进程
#   - 子进程内 thread workers 并发调用 vLLM API
#   - 无需客户端 GPU；请按 vLLM --max-num-seqs 调整 shards × workers

name: kimi_asr_batch

input:
  manifest: datasets/manifests/cleaned_source_A.parquet

output:
  manifest: datasets/manifests/kimi_asr_source_A.parquet

execution:
  executor: thread
  workers: 4
  fail_fast: false
  checkpoint_every: 500

sharding:
  shards: 8
  strategy: duration-balanced
  parallel_shards: 8
  workers: 4
  executor: thread

pipeline:
  - name: kimi_asr
    operator: asr.kimi_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/kimi.yaml
