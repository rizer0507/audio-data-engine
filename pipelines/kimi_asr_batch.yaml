# Kimi-Audio local high-throughput ASR.
# Each shard is an isolated process pinned to one GPU and loads the model once;
# samples inside a shard use native model batching. Adjust the GPU list and the
# shard count together for the target host.
name: kimi_asr_batch

input:
  manifest: datasets/manifests/cleaned_source_A.parquet
output:
  manifest: datasets/manifests/kimi_asr_source_A.parquet

execution:
  executor: sequential
  workers: 1
  fail_fast: false
  checkpoint_every: 500

sharding:
  shards: 8
  strategy: duration-balanced
  parallel_shards: 8
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  instances_per_gpu: 1
  workers: 1
  executor: sequential

pipeline:
  - name: kimi_asr
    operator: asr.kimi_batch
    params:
      input_audio_key: resampled_16k
      config_path: configs/asr/kimi.yaml
  - name: release_after_kimi
    operator: runtime.release_asr_models
