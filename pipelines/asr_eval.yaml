# 工序⑤（兼容）：已有评测文本时只做清洗 + 对金标算字准 + 导出。
# 推荐新入口：pipelines/eval_metric_pipeline.yaml + --eval-name / --eval-model
#
#   audio-data pipeline run pipelines/asr_eval.yaml \
#     --eval-name eval_local_test \
#     --eval-model qwen --eval-model qwen-sft-epoch10
#
# 不传 --eval-name 时使用下方写死路径。

name: asr_eval
input:
  manifest: datasets/stage1/derived/asr_eval_source_A.parquet
output:
  manifest: datasets/stage1/derived/asr_eval_metrics_source_A.parquet
pipeline:
  - name: normalize_transcripts
    operator: quality.normalize_transcripts
    params:
      keep_raw: true
      blank_exact_hotwords_path: configs/normalization/blank_exact_eval_v1.yaml
  - name: evaluation_metrics
    operator: quality.text_metrics
    params:
      config_path: configs/metrics/model_eval.yaml
      normalization_path: configs/normalization/zh_asr_v1.yaml
      skip_missing_reference: true
  - name: evaluation_report
    operator: quality.evaluation_report
    params:
      bucket_key: type
      allow_missing_gold: true
      export_xlsx: true
      fail_on_regression: false
