# 工序⑤ 示例：模型评测 CER（与 Gold production 共用 quality.text_metrics / MetricRunner）
# reference = gold_text；hypothesis = old_model_text / new_model_text
# 配置：configs/metrics/model_eval.yaml
name: asr_eval
input:
  manifest: datasets/manifests/asr_eval_source_A.parquet
output:
  manifest: datasets/manifests/asr_eval_metrics_source_A.parquet
pipeline:
  - name: evaluation_metrics
    operator: quality.text_metrics
    params:
      config_path: configs/metrics/model_eval.yaml
      normalization_path: configs/normalization/zh_asr_v1.yaml
