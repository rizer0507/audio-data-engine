# 单文件 / 小批量豆包 ASR 转写
#
# 用法（任选其一）：
#   1) 改下方 input.source_dir 后直接跑：
#      audio-data pipeline run pipelines/doubao_asr_single.yaml
#
#   2) 分步入库 + 转写（推荐，可自定义目录）：
#      audio-data ingest "D:/path/to/audio_dir" --name my_batch
#      audio-data run doubao --dataset my_batch -c configs/asr/doubao.yaml
#
# 环境变量（写入项目根 .env 即可）：
#   DOUBAO_ASR_API_KEY              新版控制台 API Key
#   DOUBAO_ASR_APP_KEY              旧版控制台 APP ID（与 ACCESS_KEY 成对）
#   DOUBAO_ASR_ACCESS_KEY           旧版控制台 Access Token
#   DOUBAO_ASR_RESOURCE_ID          默认 volc.seedasr.auc

name: doubao_asr_single

input:
  source_dir: "D:/Work/asr数据/0902_test/"

output:
  manifest: datasets/manifests/doubao_asr_single.parquet

execution:
  executor: sequential
  workers: 1
  fail_fast: true

pipeline:
  - name: ingest
    operator: ingest.scan

  - name: doubao_asr
    operator: asr.doubao
    params:
      input_audio_key: raw
      transcript_key: doubao
      config_path: configs/asr/doubao.yaml
